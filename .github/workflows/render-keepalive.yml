name: Render Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    name: Ping Backend Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Warm backend service
        run: |
          KEEPALIVE_BACKEND_URL=$(node -e "const config = require('./.github/keepalive.targets.json'); const url = String(config.backendUrl || '').replace(/\/$/, ''); process.stdout.write(url);")
          if [ -z "$KEEPALIVE_BACKEND_URL" ]; then
            echo "backendUrl is empty in .github/keepalive.targets.json; skipping backend keepalive ping."
            exit 0
          fi
          curl -fsSL --max-time 20 "$KEEPALIVE_BACKEND_URL/api/health" > /dev/null

  ping-frontend:
    name: Ping Frontend Route
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Warm frontend route
        run: |
          KEEPALIVE_FRONTEND_URL=$(node -e "const config = require('./.github/keepalive.targets.json'); const url = String(config.frontendUrl || '').replace(/\/$/, ''); process.stdout.write(url);")
          if [ -z "$KEEPALIVE_FRONTEND_URL" ]; then
            echo "frontendUrl is empty in .github/keepalive.targets.json; skipping frontend keepalive ping."
            exit 0
          fi
          curl -fsSL --max-time 20 "$KEEPALIVE_FRONTEND_URL/vendors" > /dev/null
