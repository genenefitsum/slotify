name: Release Promote

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag or commit SHA being promoted
        required: true
        type: string

jobs:
  staging-gate:
    name: Validate Staging
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_BACKEND_URL != '' && vars.STAGING_FRONTEND_URL != '' }}
    steps:
      - name: Confirm backend health
        run: curl -fsSL "${{ vars.STAGING_BACKEND_URL }}/api/health"

      - name: Confirm backend readiness
        run: curl -fsSL "${{ vars.STAGING_BACKEND_URL }}/api/ready"

      - name: Confirm frontend route
        run: |
          status=$(curl -I -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_FRONTEND_URL }}/vendors")
          if [ "$status" -ne 200 ]; then
            echo "Expected 200 from frontend route check, got $status"
            exit 1
          fi

  approve-production:
    name: Approve Production
    runs-on: ubuntu-latest
    needs:
      - staging-gate
    environment:
      name: production
    steps:
      - name: Approval checkpoint
        run: echo "Production approval granted for ${{ inputs.release_tag }}"

  production-playbook:
    name: Run Production Playbook
    runs-on: ubuntu-latest
    needs:
      - approve-production
    steps:
      - name: Output production promotion checklist
        run: |
          echo "Promote release: ${{ inputs.release_tag }}"
          echo "1. Promote backend release in Render or Railway dashboard"
          echo "2. Promote frontend deployment in Vercel dashboard"
          echo "3. Verify production /api/health and /api/ready"
          echo "4. Validate login, vendor listing, and booking flow"
