name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  staging-smoke:
    name: Staging Smoke Checks
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: ${{ github.ref == 'refs/heads/main' && vars.STAGING_BACKEND_URL != '' && vars.STAGING_FRONTEND_URL != '' }}
    steps:
      - name: Check backend health
        run: curl -fsSL "${{ vars.STAGING_BACKEND_URL }}/api/health"

      - name: Check backend readiness
        run: curl -fsSL "${{ vars.STAGING_BACKEND_URL }}/api/ready"

      - name: Check frontend route fallback
        run: |
          status=$(curl -I -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_FRONTEND_URL }}/vendors")
          if [ "$status" -ne 200 ]; then
            echo "Expected 200 from frontend route check, got $status"
            exit 1
          fi

