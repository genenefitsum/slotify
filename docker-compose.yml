services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slotify-backend
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5001
      - NODE_ENV=development
      - CORS_ORIGINS=http://localhost:5175,http://localhost:5001,http://localhost:5173,http://localhost:5174,https://slotify-online.vercel.app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: slotify-frontend
    restart: always
    ports:
      - "5175:5175"
    environment:
      - VITE_API_BASE_URL=http://localhost:5001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
